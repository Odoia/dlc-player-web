server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: rotas do client-side caem no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets com hash: cache longo.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker e manifest nunca cacheiam (PWA atualiza).
  location = /sw.js            { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
}
